<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GymCoach — Reportes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="alumnos.html">GymCoach</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item" data-rol="coach"><a class="nav-link" href="alumnos.html">Alumnos</a></li>
          <li class="nav-item" data-rol="coach"><a class="nav-link" href="grupos.html">Grupos Musculares</a></li>
          <li class="nav-item" data-rol="coach"><a class="nav-link" href="ejercicios.html">Ejercicios</a></li>
          <li class="nav-item" data-rol="coach"><a class="nav-link" href="rutinas.html">Rutinas</a></li>
          <li class="nav-item" data-rol="coach"><a class="nav-link" href="asignaciones.html">Asignaciones</a></li>
          <li class="nav-item" data-rol="coach"><a class="nav-link" href="reportes.html">Reportes</a></li>
          <li class="nav-item" data-rol="alumno"><a class="nav-link" href="mi-rutina.html">Mi Rutina</a></li>
        </ul>
        <span class="navbar-text text-light me-3" id="nombreUsuario"></span>
        <button class="btn btn-outline-light btn-sm" id="btnLogout" type="button">Salir</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <h1 class="h3 mb-4">Reportes</h1>

    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label for="tipoReporte" class="form-label">Tipo de reporte</label>
            <select class="form-select" id="tipoReporte">
              <option value="alumnos-vigentes">Alumnos con rutina vigente</option>
              <option value="ejercicios-mas-usados">Ejercicios más usados</option>
              <option value="historial-asignaciones">Historial de asignaciones de un alumno</option>
            </select>
          </div>
        </div>

        <!-- Solo visible para el historial (onCambiarTipo) -->
        <div class="row g-3 mt-1 d-none" id="filtrosHistorial">
          <div class="col-md-4">
            <label for="filtroAlumno" class="form-label">Alumno</label>
            <select class="form-select" id="filtroAlumno"></select>
          </div>
          <div class="col-md-3">
            <label for="filtroDesde" class="form-label">Desde</label>
            <input type="date" class="form-control" id="filtroDesde">
          </div>
          <div class="col-md-3">
            <label for="filtroHasta" class="form-label">Hasta</label>
            <input type="date" class="form-control" id="filtroHasta">
          </div>
        </div>

        <div class="mt-3 d-flex flex-wrap gap-2">
          <button type="button" class="btn btn-primary" id="btnVerPantalla">Ver en pantalla</button>
          <button type="button" class="btn btn-outline-secondary" data-formato="csv">CSV</button>
          <button type="button" class="btn btn-outline-success" data-formato="xlsx">Excel</button>
          <button type="button" class="btn btn-outline-danger" data-formato="pdf">PDF</button>
        </div>

        <div id="alertaReporte" class="alert mt-3 mb-0 d-none" role="alert"></div>
      </div>
    </div>

    <h2 class="h5" id="tituloReporte"></h2>
    <table class="table table-striped bg-white d-none" id="tablaReporte">
      <thead id="encabezadoReporte"></thead>
      <tbody id="cuerpoReporte"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/reportes.js"></script>
</body>
</html>
